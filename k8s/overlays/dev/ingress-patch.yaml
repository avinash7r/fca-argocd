apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fca-ingress
spec:
  rules:
  - host: app.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 7777
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fca-client-service
            port:
              number: 80