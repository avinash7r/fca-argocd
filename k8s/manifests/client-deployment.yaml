apiVersion: apps/v1
kind: Deployment
metadata:
  name: fca-client-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fca-client
  template:
    metadata:
      labels:
        app: fca-client
    spec:
      containers:
        - name: fca-client
          # image: avinashrajure/fca-client:693fb3b7f2cbaec0f227058022ac51b718cedbc3
          image: client-image
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: client-config-map

---
apiVersion: v1
kind: Service
metadata:
  name: fca-client-service
spec:
  selector:
    app: fca-client
  ports:
    - port: 80
      targetPort: 80
