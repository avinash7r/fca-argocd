apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - client-deployment.yaml
  - server-deployment.yaml
  - client-config.yaml
  - server-secrets.yaml
  - ingress.yaml

images:
  - name: client-image
    newName: avinashrajure/fca-client
    newTag: dev
  - name: server-image
    newName: avinashrajure/fca-server
    newTag: dev